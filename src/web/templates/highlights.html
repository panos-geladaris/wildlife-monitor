{% extends "base.html" %}

{% block title %}Highlights - Wildlife Monitor{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1>Highlights</h1>
    <div id="bulkActions" class="d-none">
        <span id="selectedCount" class="me-2 text-muted">0 selected</span>
        <button class="btn btn-danger btn-sm" onclick="bulkDelete()">Delete Selected</button>
    </div>
</div>

<div id="highlightGrid" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 row-cols-xl-4 g-4">
</div>

<div id="loadingSpinner" class="text-center my-4 d-none">
    <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading...</span>
    </div>
</div>

<div id="noResults" class="text-center my-4 d-none">
    <p class="text-muted">No highlighted detections yet. Open a detection and click &#9733; Highlight to add it here.</p>
</div>

<div id="scrollSentinel" class="text-center my-4"></div>
{% endblock %}

{% block scripts %}
<script>
const LIMIT = 50;
let offset = 0;
let loading = false;
let hasMore = true;

const grid = document.getElementById('highlightGrid');
const loadingSpinner = document.getElementById('loadingSpinner');
const noResults = document.getElementById('noResults');

function getTriggerColor(triggerType) {
    switch (triggerType) {
        case 'motion':    return '#198754';
        case 'scheduled': return '#0d6efd';
        case 'manual':    return '#6c757d';
        default:          return '#6c757d';
    }
}

function createHighlightCard(detection) {
    const col = document.createElement('div');
    col.className = 'col';
    col.dataset.id = detection.id;

    const confidence = detection.confidence
        ? `${(detection.confidence * 100).toFixed(1)}%`
        : '';

    const emoji = detection.animal_class ? WildlifeMonitor.getAnimalIcon(detection.animal_class) + ' ' : '';
    const animalInfo = detection.animal_class
        ? `<span class="badge bg-warning text-dark">${emoji}${detection.animal_class} ${confidence}</span>`
        : '';

    const stripeColor = getTriggerColor(detection.trigger_type);

    col.innerHTML = `
        <div class="card h-100" style="border-left: 4px solid ${stripeColor};">
            <div class="position-absolute top-0 start-0 m-2" style="z-index: 1;">
                <input type="checkbox" class="form-check-input detection-checkbox"
                       data-id="${detection.id}" onchange="updateBulkActions()">
            </div>
            <span class="position-absolute top-0 end-0 m-2 text-warning" style="z-index: 1; font-size: 1.25rem; cursor: pointer;"
                  title="Remove highlight" onclick="event.preventDefault(); removeHighlight(${detection.id})">&#9733;</span>
            <a href="/detection/${detection.id}" class="text-decoration-none">
                <div class="position-relative">
                    <img class="card-img-top" style="height: 180px; object-fit: cover;"
                         src="/thumbnails/${detection.video_filename.replace(/\.[^.]+$/, '.jpg')}"
                         alt="Detection ${detection.id}"
                         loading="lazy">
                    <div class="position-absolute bottom-0 start-0 end-0 px-2 pb-2 d-flex gap-1 flex-wrap"
                         style="background: linear-gradient(transparent, rgba(0,0,0,0.55));">
                        ${animalInfo}
                    </div>
                </div>
                <div class="card-body py-2">
                    <p class="card-text text-muted small mb-0">${WildlifeMonitor.formatRelativeTime(detection.timestamp)}</p>
                </div>
            </a>
        </div>
    `;

    return col;
}

async function loadHighlights(reset = false) {
    if (loading) return;

    if (reset) {
        offset = 0;
        hasMore = true;
        grid.innerHTML = '';
    }

    if (!hasMore) return;

    loading = true;
    loadingSpinner.classList.remove('d-none');
    noResults.classList.add('d-none');

    try {
        const response = await fetch(`/api/highlights?limit=${LIMIT}&offset=${offset}`);
        const data = await response.json();
        const detections = data.detections || [];

        if (detections.length === 0 && offset === 0) {
            noResults.classList.remove('d-none');
        } else {
            detections.forEach(d => grid.appendChild(createHighlightCard(d)));
            offset += detections.length;
            hasMore = detections.length === LIMIT;
        }
    } catch (error) {
        console.error('Error loading highlights:', error);
        WildlifeMonitor.showToast('Failed to load highlights: ' + error.message, 'error');
    } finally {
        loading = false;
        loadingSpinner.classList.add('d-none');
    }
}

async function removeHighlight(id) {
    try {
        const response = await fetch(`/api/detections/${id}/highlight`, { method: 'POST' });
        if (response.ok) {
            const card = grid.querySelector(`[data-id="${id}"]`);
            if (card) card.remove();
            if (grid.children.length === 0) noResults.classList.remove('d-none');
        }
    } catch (error) {
        console.error('Error removing highlight:', error);
    }
}

// Infinite scroll
const observer = new IntersectionObserver(entries => {
    if (entries[0].isIntersecting && hasMore && !loading) {
        loadHighlights(false);
    }
}, { rootMargin: '200px' });
observer.observe(document.getElementById('scrollSentinel'));

function getSelectedIds() {
    return Array.from(document.querySelectorAll('.detection-checkbox:checked'))
        .map(cb => parseInt(cb.dataset.id));
}

function updateBulkActions() {
    const selected = getSelectedIds();
    const bulkActions = document.getElementById('bulkActions');
    const selectedCount = document.getElementById('selectedCount');

    if (selected.length > 0) {
        bulkActions.classList.remove('d-none');
        selectedCount.textContent = selected.length + ' selected';
    } else {
        bulkActions.classList.add('d-none');
    }
}

async function bulkDelete() {
    const ids = getSelectedIds();
    if (ids.length === 0) return;

    if (!confirm(`Delete ${ids.length} detection(s)? This will also remove the video files.`)) {
        return;
    }

    try {
        const response = await fetch('/api/detections/bulk-delete', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ids: ids}),
        });

        if (response.ok) {
            const data = await response.json();
            WildlifeMonitor.showToast(`Deleted ${data.records_deleted} detection(s)`, 'success');
            loadHighlights(true);
        } else {
            const data = await response.json();
            WildlifeMonitor.showToast('Failed to delete: ' + (data.error || 'Unknown error'), 'error');
        }
    } catch (error) {
        WildlifeMonitor.showToast('Error deleting detections: ' + error.message, 'error');
    }
}

loadHighlights();
</script>
{% endblock %}
