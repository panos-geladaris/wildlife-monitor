<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Wildlife Monitor{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
    {% block head %}{% endblock %}
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">Wildlife Monitor</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="/">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/gallery">Gallery</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/highlights">Highlights</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/statistics">Statistics</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/timelapses">Timelapses</a>
                    </li>
                </ul>
                <div class="navbar-nav ms-auto d-flex flex-row align-items-center gap-3">
                    <span id="navStatus" class="d-none">
                        <span class="status-indicator" id="statusDot"></span>
                        <small class="text-light ms-1" id="statusText"></small>
                    </span>
                    <button class="btn btn-sm btn-outline-light" id="darkModeToggle" title="Toggle dark mode">
                        ☀️
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <main class="container my-4">
        {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    <script>
    (function() {
        const toggle = document.getElementById('darkModeToggle');
        const html = document.documentElement;

        function applyTheme(theme) {
            html.setAttribute('data-bs-theme', theme);
            toggle.textContent = theme === 'dark' ? '🌙' : '☀️';
            localStorage.setItem('theme', theme);
        }

        const saved = localStorage.getItem('theme') || 'light';
        applyTheme(saved);

        toggle.addEventListener('click', function() {
            const current = html.getAttribute('data-bs-theme');
            applyTheme(current === 'dark' ? 'light' : 'dark');
        });

        // Active nav link
        const path = window.location.pathname;
        document.querySelectorAll('.navbar-nav .nav-link').forEach(function(link) {
            const href = link.getAttribute('href');
            if (href === '/' ? path === '/' : path.startsWith(href)) {
                link.classList.add('active');
            }
        });

        const navStatus = document.getElementById('navStatus');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');

        async function updateStatus() {
            try {
                const res = await fetch('/api/status');
                const data = await res.json();
                statusDot.className = 'status-indicator active';
                const diskPct = data.storage.disk_used_percent;
                const lastHour = data.detections.last_hour;
                statusText.textContent = lastHour + ' recent · ' + diskPct + '% disk';
                navStatus.classList.remove('d-none');
            } catch (e) {
                statusDot.className = 'status-indicator inactive';
                statusText.textContent = 'offline';
                navStatus.classList.remove('d-none');
            }
        }

        updateStatus();
        setInterval(updateStatus, 30000);
    })();
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
