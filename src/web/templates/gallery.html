{% extends "base.html" %}

{% block title %}Gallery - Wildlife Monitor{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1>Detection Gallery</h1>
    <div id="bulkActions" class="d-none">
        <span id="selectedCount" class="me-2 text-muted">0 selected</span>
        <button class="btn btn-danger btn-sm" onclick="bulkDelete()">Delete Selected</button>
    </div>
</div>

<div class="row mb-4 g-3">
    <div class="col-md-2">
        <label for="triggerFilter" class="form-label">Trigger Type</label>
        <select id="triggerFilter" class="form-select">
            <option value="">All</option>
            <option value="motion">Motion</option>
            <option value="scheduled">Scheduled</option>
            <option value="manual">Manual</option>
        </select>
    </div>
    <div class="col-md-2">
        <label for="animalFilter" class="form-label">Animal Class</label>
        <select id="animalFilter" class="form-select">
            <option value="">All</option>
        </select>
    </div>
    <div class="col-md-3">
        <label for="startDate" class="form-label">From</label>
        <input type="date" id="startDate" class="form-control">
    </div>
    <div class="col-md-3">
        <label for="endDate" class="form-label">To</label>
        <input type="date" id="endDate" class="form-control">
    </div>
    <div class="col-md-2 d-flex align-items-end">
        <div class="form-check">
            <input class="form-check-input" type="checkbox" id="selectAll" onchange="toggleSelectAll()">
            <label class="form-check-label" for="selectAll">Select All</label>
        </div>
    </div>
</div>

<div id="detectionGrid" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 row-cols-xl-4 g-4">
</div>

<div id="loadingSpinner" class="text-center my-4 d-none">
    <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading...</span>
    </div>
</div>

<div id="noResults" class="text-center my-4 d-none">
    <p class="text-muted">No detections found.</p>
</div>

<div id="scrollSentinel" class="text-center my-4"></div>
{% endblock %}

{% block scripts %}
<script>
const LIMIT = 50;
let offset = 0;
let loading = false;
let hasMore = true;

const grid = document.getElementById('detectionGrid');
const loadingSpinner = document.getElementById('loadingSpinner');
const noResults = document.getElementById('noResults');
const triggerFilter = document.getElementById('triggerFilter');
const animalFilter = document.getElementById('animalFilter');
const startDate = document.getElementById('startDate');
const endDate = document.getElementById('endDate');

function getTriggerBadgeClass(triggerType) {
    switch (triggerType) {
        case 'motion': return 'bg-success';
        case 'scheduled': return 'bg-primary';
        case 'manual': return 'bg-secondary';
        default: return 'bg-secondary';
    }
}

function createDetectionCard(detection) {
    const col = document.createElement('div');
    col.className = 'col';
    
    const confidence = detection.confidence 
        ? `${(detection.confidence * 100).toFixed(1)}%` 
        : '';
    
    const emoji = detection.animal_class ? WildlifeMonitor.getAnimalIcon(detection.animal_class) + ' ' : '';
    const speciesInfo = detection.bird_species ? ` (${detection.bird_species})` : '';
    const animalInfo = detection.animal_class 
        ? `<span class="badge bg-warning text-dark">${emoji}${detection.animal_class}${speciesInfo} ${confidence}</span>`
        : '';

    const starIcon = detection.highlighted
        ? '<span class="position-absolute top-0 end-0 m-2 text-warning" style="z-index: 1; font-size: 1.25rem;" title="Highlighted">&#9733;</span>'
        : '';

    const soundBadge = detection.sound_class
        ? `<span class="badge bg-info text-dark">🔊 ${detection.sound_species || detection.sound_class}</span>`
        : '';
    
    col.innerHTML = `
        <div class="card h-100">
            <div class="position-absolute top-0 start-0 m-2" style="z-index: 1;">
                <input type="checkbox" class="form-check-input detection-checkbox" 
                       data-id="${detection.id}" onchange="updateBulkActions()">
            </div>
            ${starIcon}
            <a href="/detection/${detection.id}" class="text-decoration-none">
                <img class="card-img-top" style="height: 180px; object-fit: cover;"
                     src="/thumbnails/${detection.video_filename.replace(/\.[^.]+$/, '.jpg')}"
                     alt="Detection ${detection.id}"
                     loading="lazy">
                <div class="card-body">
                    <p class="card-text text-muted small mb-2">${WildlifeMonitor.formatRelativeTime(detection.timestamp)}</p>
                    <div class="d-flex gap-2 flex-wrap">
                        <span class="badge ${getTriggerBadgeClass(detection.trigger_type)}">${detection.trigger_type}</span>
                        ${animalInfo}
                        ${soundBadge}
                    </div>
                </div>
            </a>
        </div>
    `;
    
    return col;
}

async function loadDetections(reset = false) {
    if (loading) return;
    
    if (reset) {
        offset = 0;
        hasMore = true;
        grid.innerHTML = '';
    }
    
    if (!hasMore) return;
    
    loading = true;
    loadingSpinner.classList.remove('d-none');
    noResults.classList.add('d-none');
    
    const params = new URLSearchParams({
        limit: LIMIT,
        offset: offset
    });
    
    const triggerType = triggerFilter.value;
    const animalClass = animalFilter.value;
    
    if (triggerType) params.append('trigger_type', triggerType);
    if (animalClass) params.append('animal_class', animalClass);
    if (startDate.value) params.append('start_date', startDate.value);
    if (endDate.value) params.append('end_date', endDate.value + 'T23:59:59');
    
    try {
        const response = await fetch(`/api/detections?${params}`);
        const data = await response.json();
        
        const detections = data.detections || data;
        
        if (detections.length === 0 && offset === 0) {
            noResults.classList.remove('d-none');
        } else {
            detections.forEach(detection => {
                grid.appendChild(createDetectionCard(detection));
            });
            
            offset += detections.length;
            hasMore = detections.length === LIMIT;
        }
    } catch (error) {
        console.error('Error loading detections:', error);
    } finally {
        loading = false;
        loadingSpinner.classList.add('d-none');
    }
}

async function loadAnimalClasses() {
    try {
        const response = await fetch('/api/detections?limit=1000');
        const data = await response.json();
        const detections = data.detections || data;
        
        const classes = new Set();
        detections.forEach(d => {
            if (d.animal_class) classes.add(d.animal_class);
        });
        
        classes.forEach(cls => {
            const option = document.createElement('option');
            option.value = cls;
            option.textContent = cls;
            animalFilter.appendChild(option);
        });
    } catch (error) {
        console.error('Error loading animal classes:', error);
    }
}

triggerFilter.addEventListener('change', () => loadDetections(true));
animalFilter.addEventListener('change', () => loadDetections(true));
startDate.addEventListener('change', () => loadDetections(true));
endDate.addEventListener('change', () => loadDetections(true));

// Infinite scroll
const observer = new IntersectionObserver(entries => {
    if (entries[0].isIntersecting && hasMore && !loading) {
        loadDetections(false);
    }
}, { rootMargin: '200px' });
observer.observe(document.getElementById('scrollSentinel'));

function getSelectedIds() {
    return Array.from(document.querySelectorAll('.detection-checkbox:checked'))
        .map(cb => parseInt(cb.dataset.id));
}

function updateBulkActions() {
    const selected = getSelectedIds();
    const bulkActions = document.getElementById('bulkActions');
    const selectedCount = document.getElementById('selectedCount');
    
    if (selected.length > 0) {
        bulkActions.classList.remove('d-none');
        selectedCount.textContent = selected.length + ' selected';
    } else {
        bulkActions.classList.add('d-none');
    }
}

function toggleSelectAll() {
    const checked = document.getElementById('selectAll').checked;
    document.querySelectorAll('.detection-checkbox').forEach(cb => {
        cb.checked = checked;
    });
    updateBulkActions();
}

async function bulkDelete() {
    const ids = getSelectedIds();
    if (ids.length === 0) return;
    
    if (!confirm(`Delete ${ids.length} detection(s)? This will also remove the video files.`)) {
        return;
    }
    
    try {
        const response = await fetch('/api/detections/bulk-delete', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ids: ids}),
        });
        
        const data = await response.json();
        
        if (response.ok) {
            document.getElementById('selectAll').checked = false;
            WildlifeMonitor.showToast(`Deleted ${data.records_deleted} detection(s)`, 'success');
            loadDetections(true);
        } else {
            WildlifeMonitor.showToast('Failed to delete: ' + (data.error || 'Unknown error'), 'error');
        }
    } catch (error) {
        WildlifeMonitor.showToast('Error deleting detections: ' + error.message, 'error');
    }
}

loadAnimalClasses();
loadDetections();
</script>
{% endblock %}
